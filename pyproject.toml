[project]
name = "sound-system"
version = "0.1.0"
description = "Local audio/video cleanup pipeline (SPEC.md)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "numpy==1.26.4",
    "soundfile==0.12.1",
    "soxr",
    "pedalboard==0.9.16",
    "deepfilternet==0.5.6",
    "deepfilterlib==0.5.6",
    "audio-separator[gpu]==0.30.2",
    "diffq-fixed==0.2.4",
    "silero-vad==5.1.2",
    "faster-whisper==1.1.1",
    "ctranslate2==4.5.0",
    "setuptools<81",
    "onnxruntime-gpu==1.20.0",
    "nvidia-cublas-cu12==12.4.5.8",
    "nvidia-cudnn-cu12==9.1.0.70",
    "nvidia-cuda-runtime-cu12==12.4.127",
    "nvidia-cufft-cu12==11.2.1.3",
    "nvidia-curand-cu12==10.3.5.147",
    "nvidia-cusparse-cu12==12.3.1.170",
    "nvidia-cusolver-cu12==11.6.1.9",
    "nvidia-cuda-nvrtc-cu12==12.4.127",
    "nvidia-nvjitlink-cu12==12.4.127",
    "torch==2.5.1+cu124",
    "torchaudio==2.5.1+cu124",
    "torchvision==0.20.1+cu124",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.uv]
package = false
# Exactly one ONNX Runtime distribution: onnxruntime-gpu. Any requirement on
# the CPU-only "onnxruntime" wheel (faster-whisper, silero-vad) is neutralized
# here; onnxruntime-gpu provides the same `onnxruntime` import.
override-dependencies = [
    "onnxruntime; sys_platform == 'never'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (30-min pipeline, memory bounds)",
]
