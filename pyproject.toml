[project]
name = "sound-system"
version = "0.1.0"
description = "Safa (صفا) — local audio/video cleanup pipeline (SPEC.md)"
requires-python = ">=3.11,<3.12"
# Shared (variant-independent) dependencies. The torch stack and the ONNX
# Runtime distribution differ per hardware variant and live in the
# conflicting `cpu` / `cu124` extras below (M10c §2).
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "numpy==1.26.4",
    "soundfile==0.12.1",
    "soxr",
    "pedalboard==0.9.16",
    "deepfilternet==0.5.6",
    "deepfilterlib==0.5.6",
    "audio-separator==0.30.2",
    "audio-separator[gpu]==0.30.2; extra == 'cu124' and sys_platform != 'darwin' and platform_machine != 'aarch64'",
    # onnxruntime-gpu provides the `onnxruntime` import on Windows/Linux x64
    # for BOTH variants (CPU EP works without CUDA; the CUDA libs only load
    # if an nvidia wheel/dir is present). onnxruntime-gpu ships no darwin or
    # aarch64 wheels → the CPU-only onnxruntime wheel is used there instead
    # (kept alive for darwin/aarch64 by the tool.uv override below).
    "onnxruntime==1.20.0; sys_platform == 'darwin' or platform_machine == 'aarch64'",
    "onnxruntime-gpu==1.20.0; sys_platform != 'darwin' and platform_machine != 'aarch64'",
    "nvidia-cublas-cu12==12.4.5.8; extra == 'cu124' and sys_platform != 'darwin'",
    "nvidia-cudnn-cu12==9.1.0.70; extra == 'cu124' and sys_platform != 'darwin'",
    "nvidia-cuda-runtime-cu12==12.4.127; extra == 'cu124' and sys_platform != 'darwin'",
    "nvidia-cufft-cu12==11.2.1.3; extra == 'cu124' and sys_platform != 'darwin'",
    "nvidia-curand-cu12==10.3.5.147; extra == 'cu124' and sys_platform != 'darwin'",
    "nvidia-cusparse-cu12==12.3.1.170; extra == 'cu124' and sys_platform != 'darwin'",
    "nvidia-cusolver-cu12==11.6.1.9; extra == 'cu124' and sys_platform != 'darwin'",
    "nvidia-cuda-nvrtc-cu12==12.4.127; extra == 'cu124' and sys_platform != 'darwin'",
    "nvidia-nvjitlink-cu12==12.4.127; extra == 'cu124' and sys_platform != 'darwin'",
    "torch==2.5.1; extra != 'cu124' or sys_platform == 'darwin'",
    "torch==2.5.1+cu124; extra == 'cu124' and sys_platform != 'darwin'",
    "torchaudio==2.5.1; extra != 'cu124' or sys_platform == 'darwin'",
    "torchaudio==2.5.1+cu124; extra == 'cu124' and sys_platform != 'darwin'",
    "torchvision==0.20.1; extra != 'cu124' or sys_platform == 'darwin'",
    "torchvision==0.20.1+cu124; extra == 'cu124' and sys_platform != 'darwin'",
    # diffq-fixed has no macOS wheel and a broken sdist; on darwin
    # audio-separator uses the original diffq instead.
    "diffq-fixed==0.2.4; sys_platform != 'darwin'",
    "silero-vad==5.1.2",
    "faster-whisper==1.1.1",
    "ctranslate2==4.5.0",
    "setuptools<81",
    "psutil>=7.2.2",
    "numba>=0.68.1",
]

[project.optional-dependencies]
# Variant extras (M10c §2). The BASE dependency set resolves a working
# CPU runtime on every OS, so a bare `uv sync`/`uv run` always yields a
# usable environment; `--extra cpu` pins the same wheel set from the
# pytorch CPU index (proper CPU-only builds on Linux too), and
# `--extra cu124` swaps in the CUDA 12.4 stack (dev machine, installers).
cpu = [
    "onnxruntime==1.20.0",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "torchvision==0.20.1",
]
# CUDA 12.4 runtime (NVIDIA, driver >= 551). The same deps also live in the
# base list gated on `extra == 'cu124'` — duplicating the pins here keeps
# the fork self-describing AND satisfies the `tool.uv.sources` rule that a
# package sourced per-extra must be a member of that extra on every
# platform (darwin gets the CPU/PyPI twins: no CUDA wheels exist for macOS).
cu124 = [
    "audio-separator[gpu]==0.30.2; sys_platform != 'darwin' and platform_machine != 'aarch64'",
    "onnxruntime-gpu==1.20.0; sys_platform != 'darwin' and platform_machine != 'aarch64'",
    "onnxruntime==1.20.0; sys_platform == 'darwin' or platform_machine == 'aarch64'",
    "torch==2.5.1+cu124; sys_platform != 'darwin'",
    "torch==2.5.1; sys_platform == 'darwin'",
    "torchaudio==2.5.1+cu124; sys_platform != 'darwin'",
    "torchaudio==2.5.1; sys_platform == 'darwin'",
    "torchvision==0.20.1+cu124; sys_platform != 'darwin'",
    "torchvision==0.20.1; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    # manual e2e scripts (tests/e2e_*_playwright.py) run via `uv run`
    "playwright",
]

[tool.uv]
package = false
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu124" },
    ],
]
# Exactly one ONNX Runtime distribution per environment. Every requirement
# on the CPU-only "onnxruntime" wheel (faster-whisper, silero-vad, our own
# pins) resolves ONLY on platforms where onnxruntime-gpu has no wheel
# (darwin, aarch64); on Windows/Linux x64 it is dropped so onnxruntime-gpu
# is the single provider of the `onnxruntime` import — same mechanism the
# project used pre-variants. `extra` markers cannot gate overrides (they
# are evaluated against the requiring package's extras, not ours), so the
# split is by platform, not by variant.
override-dependencies = [
    "onnxruntime==1.20.0; sys_platform == 'darwin' or platform_machine == 'aarch64'",
]

[tool.uv.sources]
# The `extra` key selects an index per requested extra; darwin always
# falls through to PyPI (no CUDA wheels exist for macOS).
torch = [
    { index = "pytorch-cu124", extra = "cu124", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
]
torchaudio = [
    { index = "pytorch-cu124", extra = "cu124", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cu124", extra = "cu124", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep pytest scratch on the project drive (F:), never in %TEMP% on C:
# (R1: earlier runs left ~9 GB in C:\...\Temp\pytest-of-<user> and filled C:).
# --basetemp is wiped at the start of every run, so only one run's files exist.
addopts = "--basetemp=.pytest_tmp"
markers = [
    "slow: long-running tests (30-min pipeline, memory bounds)",
]
