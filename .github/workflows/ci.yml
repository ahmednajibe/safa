name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.19"
          python-version: "3.11"
      - name: sync (cpu extra)
        run: uv sync --extra cpu
      - name: fetch ffmpeg 7.1.1 into tools/ffmpeg (sha256-pinned)
        shell: pwsh
        # tools/ffmpeg is gitignored; tests and fixture generation need it.
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-essentials_build.zip"
          $want = "04861d3339c5ebe38b56c19a15cf2c0cc97f5de4fa8910e4d47e5e6404e4a2d4"
          New-Item -ItemType Directory -Force data\tmp\ffdl, tools\ffmpeg | Out-Null
          Invoke-WebRequest $url -OutFile data\tmp\ffdl\ff.zip
          $got = (Get-FileHash data\tmp\ffdl\ff.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "ffmpeg zip sha256 mismatch: $got" }
          Expand-Archive data\tmp\ffdl\ff.zip data\tmp\ffdl\x
          $inner = Get-ChildItem data\tmp\ffdl\x -Directory | Select-Object -First 1
          Copy-Item (Join-Path $inner.FullName "bin") tools\ffmpeg\bin -Recurse -Force
          Remove-Item -Recurse -Force data\tmp\ffdl
      - name: pytest (not slow)
        run: uv run --extra cpu python -m pytest -m "not slow" -q

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: vitest
        working-directory: frontend
        run: |
          npm ci
          npx vitest run
      - name: build
        working-directory: frontend
        run: npm run build

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - name: shell lint
        run: |
          sh -n install.sh
          sh -n scripts/package-unix.sh
      - name: dockerfile hadolint (static)
        run: |
          docker run --rm -i hadolint/hadolint < Dockerfile || true
          docker run --rm -i hadolint/hadolint < Dockerfile.cuda || true
