[project]
name = "sound-system-cpu"
version = "0.1.0"
description = "CPU-only wheel set for the portable package (M10b): same runtime deps as the root project minus every CUDA component."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "numpy==1.26.4",
    "soundfile==0.12.1",
    "soxr",
    "pedalboard==0.9.16",
    "deepfilternet==0.5.6",
    "deepfilterlib==0.5.6",
    "audio-separator==0.30.2",
    "diffq-fixed==0.2.4",
    "silero-vad==5.1.2",
    "faster-whisper==1.1.1",
    "ctranslate2==4.5.0",
    "setuptools<81",
    "onnxruntime==1.20.0",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "torchvision==0.20.1",
    "psutil>=7.2.2",
]

[tool.uv]
package = false
